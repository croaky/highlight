<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Marshfall</title>
    <meta property="og:title" content="Marshfall" />
    <link rel="stylesheet" href="{{.CSSPath}}" />
    <style>
      body {
        margin: 0;
      }
    </style>
    <script>
      const touch = "ontouchstart" in window;
    </script>
  </head>
  <!-- A comment that spans
       two lines and closes here -->
  <body class="booting">
    <p>Defend the marsh &amp; the tide, if a &lt; b.</p>
    <p>An unescaped less-than: if a < b then nothing here is a tag.</p>
    <details class=faq open>
      <summary>Why not 12 teams?</summary>
      <p>A 12-team field leaves too much to chance.</p>
    </details>
    <input name="q" ah-submit-on-type ah-debounce-on-type="300" />
    <img src='/logo.svg' alt='' width=32 height=32>
    <svg xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100">
      <text y=".9em" font-size="90">🐏</text>
    </svg>
    <button @click="start" data-live="/state">Play</button>
  </body>
</html>
